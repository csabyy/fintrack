# FinTrack + PostgreSQL. Usage:
#   cp .env.example .env   # set NEXTAUTH_SECRET (and optional TrueLayer keys)
#   docker compose up -d --build
# Then open http://localhost:3000 and register the first user.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack}
      POSTGRES_DB: fintrack
    volumes:
      - fintrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ${FINTRACK_IMAGE:-fintrack:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://fintrack:${POSTGRES_PASSWORD:-fintrack}@db:5432/fintrack
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET (openssl rand -base64 32)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Optional TrueLayer bank sync (disabled while empty)
      TRUELAYER_CLIENT_ID: ${TRUELAYER_CLIENT_ID:-}
      TRUELAYER_CLIENT_SECRET: ${TRUELAYER_CLIENT_SECRET:-}
      TRUELAYER_ENV: ${TRUELAYER_ENV:-sandbox}
      TRUELAYER_PROVIDERS: ${TRUELAYER_PROVIDERS:-}
      BANK_SYNC_TIME: ${BANK_SYNC_TIME:-06:00}
      CRON_SECRET: ${CRON_SECRET:-}

volumes:
  fintrack-db:
